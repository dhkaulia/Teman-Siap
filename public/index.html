<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teman Siap — Kesiapan Emosi, Finansial & Relasi</title>
  <meta name="description" content="Pahami dirimu, pahami uangmu, bangun masa depan lebih tenang bersama.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1514">
  <meta name="theme-color" content="#F4F6F5">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <!-- Skip Link to Main Content -->
  <a href="#view" class="skip-link">Lewati ke konten utama</a>

  <!-- Screen Reader Live Region for Step Transitions & Timer Milestones -->
  <div id="liveAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand-badge">
        <div class="brand-symbol" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 20h10"/>
            <path d="M12 20v-8"/>
            <path d="M12 12c0-4 3-6 7-6-1 4-3 6-7 6z" fill="currentColor"/>
            <path d="M12 12c0-3-2-5-5-5 1 3 2 5 5 5z" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Teman Siap</div>
        </div>
      </div>
      <div class="header-controls">
        <button id="themeToggle" class="icon-btn" aria-label="Ganti mode terang/gelap" title="Tema">
          <span id="themeIcon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Install Hint Banner (Appears once, after first completed practice, never on first load) -->
    <div id="installHintContainer" class="install-hint-container" hidden></div>

    <main id="view" tabindex="-1"></main>

    <nav id="nav" aria-label="Menu navigasi utama"></nav>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
